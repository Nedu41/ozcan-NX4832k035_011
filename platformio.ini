; Nextion NX4832K035_011 (3,5" seri HMI) + ESP32 surucu karti.
; UYARI: ESP32 kart modeli henuz belli degil (CLAUDE.md acik soru). Asagidaki board gecici varsayim;
; kart teyit edilince degistir (pin/PSRAM/flash docs/DONANIM.md'ye yazilir).
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
