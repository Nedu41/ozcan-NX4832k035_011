; Nextion NX4832K035_011 (3,5" seri HMI) + ESP-01 (ESP8266, 1 MB flash) WiFi koprusu.
; ESP-01 flash boyutu esptool flash-id ile teyit edildi (2026-10-16): GigaDevice d8/4014 = 1 MB.
[env:esp01]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.ldscript = eagle.flash.1m64.ld  ; 64 KB LittleFS, OTA icin ~470 KB uygulama
monitor_speed = 115200
build_src_filter = -<*> +<esp01_test.cpp>
build_flags = -DBEARSSL_SSL_BASIC  ; TLS: daha az sifre takimi = daha az flash
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2

; Eski ESP32 varsayimi (CrowPanel mantigi icin); ESP-01 karariyla askida.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<esp01_test.cpp>
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2

; Kablosuz yukleme: pio run -e esp01_ota -t upload
[env:esp01_ota]
extends = env:esp01
upload_protocol = espota
upload_port = nxhub.local
